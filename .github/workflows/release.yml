name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            build_script: build:macos
            asset_arch: arm64
            artifact_glob: desktop/dist-release/*
          - platform: macos-x64
            runner: macos-15-intel
            build_script: build:macos
            asset_arch: x64
            artifact_glob: desktop/dist-release/*
          - platform: windows
            runner: windows-2022
            build_script: build:windows
            asset_arch: x64
            artifact_glob: desktop/dist-release/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install service dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --ignore-scripts

      - name: Sync desktop version from Git tag
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME || '';
          if (!tag.startsWith('v')) {
            console.log('No release tag detected; keeping checked-in desktop version.');
            process.exit(0);
          }

          const version = tag.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Unsupported release tag version: ${tag}`);
          }

          function updateJsonVersion(file) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            parsed.version = version;
            fs.writeFileSync(file, `${JSON.stringify(parsed, null, 2)}\n`);
          }

          updateJsonVersion('desktop/src-tauri/tauri.conf.json');
          updateJsonVersion('desktop/package.json');

          const cargoFile = 'desktop/src-tauri/Cargo.toml';
          const cargoText = fs.readFileSync(cargoFile, 'utf8');
          const nextCargoText = cargoText.replace(/^version = ".*"$/m, `version = "${version}"`);
          if (nextCargoText === cargoText) {
            throw new Error('Could not update desktop/src-tauri/Cargo.toml package version');
          }
          fs.writeFileSync(cargoFile, nextCargoText);
          console.log(`Synced desktop version to ${version}`);
          NODE

      - name: Build desktop app
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || unset TAURI_SIGNING_PRIVATE_KEY
          [ -n "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}" ] || unset TAURI_SIGNING_PRIVATE_KEY_PATH
          [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ] || unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          validation_file="$(mktemp)"
          signing_check_log="$(mktemp)"
          trap 'rm -f "$validation_file" "$signing_check_log"' EXIT
          printf 'airouter updater signing probe\n' > "$validation_file"

          signing_enabled=false
          build_args=()
          if npx tauri signer sign "$validation_file" > "$signing_check_log" 2>&1; then
            signing_enabled=true
            echo "Updater signing key validated; signed updater artifacts will be generated."
          else
            cat "$signing_check_log"
            build_args=(-- --config '{"bundle":{"createUpdaterArtifacts":false}}')
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PATH TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "::notice title=Updater signing disabled::Tauri could not sign a validation file; this run will publish installer artifacts without signed updater packages or latest.json."
          fi
          echo "AIR_OUTER_UPDATER_SIGNING_ENABLED=$signing_enabled" >> "$GITHUB_ENV"

          npm run ${{ matrix.build_script }} "${build_args[@]}" 2>&1 | tee ../desktop-build-${{ matrix.platform }}.log

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          log_file="desktop-build-${{ matrix.platform }}.log"
          if [ -f "$log_file" ]; then
            tail -n 120 "$log_file"
            summary="$(grep -iE 'error|failed|cannot|could not|not found|denied|panic|exception' "$log_file" | tail -n 40 || true)"
            if [ -z "$summary" ]; then
              summary="$(tail -n 25 "$log_file")"
            fi
            escaped_summary="$(printf '%s' "$summary" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=${{ matrix.platform }} desktop build failed::$escaped_summary"
          fi
          exit 0

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: airouter-${{ matrix.platform }}-build-log
          path: desktop-build-${{ matrix.platform }}.log
          if-no-files-found: ignore

      - name: Normalize macOS DMG name
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          asset_arch="${{ matrix.asset_arch }}"
          dmg_dir="desktop/src-tauri/target/release/bundle/dmg"
          dmgs=("$dmg_dir"/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf 'Expected exactly one macOS DMG, found %s\n' "${#dmgs[@]}" >&2
            printf '%s\n' "${dmgs[@]}" >&2
            exit 1
          fi
          mv "${dmgs[0]}" "$dmg_dir/Airouter_${version}_${asset_arch}.dmg"

      - name: Normalize Windows installer name
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          installer_dir="desktop/src-tauri/target/release/bundle/nsis"
          installers=("$installer_dir"/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            printf 'Expected exactly one Windows installer, found %s\n' "${#installers[@]}" >&2
            printf '%s\n' "${installers[@]}" >&2
            exit 1
          fi
          mv "${installers[0]}" "$installer_dir/Airouter_${version}_x64-setup.exe"

      - name: Collect updater release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          asset_arch="${{ matrix.asset_arch }}"
          release_dir="desktop/dist-release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            dmg_dir="desktop/src-tauri/target/release/bundle/dmg"
            macos_dir="desktop/src-tauri/target/release/bundle/macos"
            cp "$dmg_dir/Airouter_${version}_${asset_arch}.dmg" "$release_dir/"
            if [ "${AIR_OUTER_UPDATER_SIGNING_ENABLED:-false}" = "true" ]; then
              cp "$macos_dir/Airouter.app.tar.gz" "$release_dir/Airouter_${version}_${asset_arch}.app.tar.gz"
              cp "$macos_dir/Airouter.app.tar.gz.sig" "$release_dir/Airouter_${version}_${asset_arch}.app.tar.gz.sig"
            fi
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            nsis_dir="desktop/src-tauri/target/release/bundle/nsis"
            cp "$nsis_dir/Airouter_${version}_x64-setup.exe" "$release_dir/"
            if [ "${AIR_OUTER_UPDATER_SIGNING_ENABLED:-false}" = "true" ]; then
              updater_zips=("$nsis_dir"/*.zip)
              if [ "${#updater_zips[@]}" -ne 1 ]; then
                printf 'Expected exactly one Windows updater zip, found %s\n' "${#updater_zips[@]}" >&2
                printf '%s\n' "${updater_zips[@]}" >&2
                exit 1
              fi
              cp "${updater_zips[0]}" "$release_dir/Airouter_${version}_x64-setup.exe.zip"
              cp "${updater_zips[0]}.sig" "$release_dir/Airouter_${version}_x64-setup.exe.zip.sig"
            fi
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: airouter-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Detect signed updater artifacts
        id: updater
        shell: bash
        run: |
          set -euo pipefail
          if find release-assets -type f \( -name '*.app.tar.gz.sig' -o -name '*.exe.zip.sig' -o -name '*.nsis.zip.sig' -o -name '*.msi.zip.sig' \) | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Updater metadata skipped::No signed updater artifacts were collected; publish will include installer assets only."
          fi

      - name: Generate updater latest.json
        if: steps.updater.outputs.enabled == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          node desktop/scripts/generate-latest-json.mjs --input release-assets --output release-assets --version "$version" --repo "$GH_REPO"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          exec > >(tee release-publish.log) 2>&1
          find release-assets -type f -maxdepth 2 -print
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
          fi

      - name: Report release failure
        if: failure()
        shell: bash
        run: |
          if [ -f release-publish.log ]; then
            tail -n 80 release-publish.log
            escaped_tail="$(tail -n 40 release-publish.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=release publish failed::$escaped_tail"
          fi
